  /* ---------- Image Gallery (Figma 3419:25386) – 4 Spalten, je ein Hoch- und ein Querformat im Wechsel, Mobile 2 Spalten ---------- */

  .gal__col { display: grid; gap: var(--g); }
  @media (max-width: 900px) { .gal { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .gal__col { gap: 12px; } }

<div class="demo-spacer">Bild anklicken: Lightbox öffnet sich aus der Kachel.</div>
<template id="demo-notes">
  <p class="demo-sheet__lead">Die Bilder öffnen sich beim Scrollen wie ein Fenster (Rahmen wächst von innen auf volle Grösse, gleich wie Single Image), die Spalten 2 und 4 laufen leicht versetzt (Parallax). Hover zeigt Verlauf, Bildlegende und Lupe (Anforderung Suan); ein Klick öffnet die Lightbox, die Bildlegende und der Bildnachweis stehen dort.</p>
  <h3>Ablauf</h3>
  <table>
    <tr><th>Was</th><th>Auslöser</th><th>Dauer · Easing</th></tr>
    <tr><td>Rahmen öffnet sich von innen (<code>clip-path</code> 6 % → 0 %), wie Single Image</td><td>Scroll, Kachel bei 85 % Viewport</td><td>1.1 s · <code>AR.ease.out</code></td></tr>
    <tr><td>Bild blendet ein, 104 % → 100 %</td><td>Bild geladen (<code>AR.lazy</code>)</td><td>0.9 s · <code>AR.ease.out</code></td></tr>
    <tr><td>Spalten 2 + 4 laufen 48 px gegen die Scrollrichtung (nur Desktop)</td><td>Scroll, an Scroll gekoppelt</td><td><code>scrub: true</code>, linear</td></tr>
    <tr><td>Hover: Bild 105 %, Verlauf 0 → 60 %, Legende + Lupe von unten</td><td>Maus / Tastaturfokus</td><td>CSS 0.2–0.6 s · <code>--ease-out</code></td></tr>
    <tr><td>Lightbox öffnen / schliessen</td><td>Klick, Enter, Esc</td><td>siehe <a href="../lightbox/">Lightbox</a> · Code in <a href="../lightbox/lightbox.js">lightbox.js</a></td></tr>
    <tr><td>Reduzierte Bewegung</td><td colspan="2">Kacheln blenden nur ein (0.4 s), Bild nur Deckkraft, keine Parallax, Lightbox ohne Morph.</td></tr>
  </table></template>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<script src="../../shared/demo.js"></script>
<script src="../lightbox/lightbox.js"></script>
<script data-demo>
AR.demo(({ reduced }) => {
  const tiles = gsap.utils.toArray('#gal .g-item');
  AR.lazy();

  // 1 · Reveal wie Single Image: Rahmen öffnet sich von innen (clip-path 6 % → 0 %), Bild blendet per AR.lazy ein
  tiles.forEach(frame => {
    gsap.fromTo(frame, reduced ? { autoAlpha: 0 } : { clipPath: 'inset(6% 6% 6% 6%)' }, {
      ...(reduced ? { autoAlpha: 1, duration: .4 } : { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.1, clearProps: 'clipPath' }),   // danach entfernen, sonst wird der Fokusrahmen abgeschnitten
      ease: AR.ease.out,
      scrollTrigger: { trigger: frame, start: 'top 85%', once: true },
    });
  });

  // 2 · Parallax: jede zweite Spalte läuft leicht versetzt (nur ab 901 px, nicht bei Reduced Motion)
  if (!reduced) gsap.matchMedia().add('(min-width: 901px)', () => {
    gsap.fromTo('#gal .gal__col:nth-child(even)', { y: 48 }, {
      y: -48, ease: 'none',
      scrollTrigger: { trigger: '#gal', start: 'top bottom', end: 'bottom top', scrub: true },
    });
  });

  // 3 · Lightbox (gemeinsamer Code in media/lightbox/lightbox.js)
  ARLightbox(tiles);
});
</script>
